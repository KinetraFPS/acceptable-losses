<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Acceptable Losses</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Jersey+10&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: one-screen game. HUD strip on top, framed playfield, crew roster + news ticker below.
   Pixel UI: notched 3px frames, bevelled buttons, segmented meters, window title bars on every panel. */
:root{
  --bg:#0a0c16;
  --panel:#141829;
  --panel2:#1c2240;
  --line:#323b66;
  --line-hi:#4f5a96;
  --ink:#05070a;
  --fg:#e8ecf8;
  --muted:#8a93bd;
  --brand:#ffd23f;
  --brand-ink:#231a00;
  --danger:#ff4d6d;
  --ok:#4fe0a6;
  --crystal:#b98cff;
  --f-display:'Jersey 10','Arial Narrow',sans-serif;
  --f-body:'DotGothic16',system-ui,sans-serif;
  --f-label:'Silkscreen','Courier New',monospace;
  --f-mono:'VT323',ui-monospace,Menlo,monospace;
  --b:3px;
  --notch:polygon(0 var(--b),var(--b) var(--b),var(--b) 0,calc(100% - var(--b)) 0,calc(100% - var(--b)) var(--b),100% var(--b),100% calc(100% - var(--b)),calc(100% - var(--b)) calc(100% - var(--b)),calc(100% - var(--b)) 100%,var(--b) 100%,var(--b) calc(100% - var(--b)),0 calc(100% - var(--b)));
  --frame:inset 0 0 0 var(--b) var(--line);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img,canvas{-webkit-user-drag:none}
body{background-color:var(--bg);background-image:radial-gradient(rgba(140,150,220,.07) 1px,transparent 1.2px);background-size:9px 9px;color:var(--fg);font:15px/1.5 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;font-variant-ligatures:none}
button,input{font-variant-ligatures:none}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;min-height:0}
#hud:empty{display:none}
#stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
#cv{display:block;touch-action:none}
#cv.framed{box-shadow:0 0 0 3px var(--line),0 0 0 6px var(--ink)}
#overlay{position:absolute;inset:0;pointer-events:none}
#overlay > *{pointer-events:auto}
#bar{display:flex;flex-direction:column;gap:6px;min-width:0}
#bar:empty{display:none}

/* shared pixel frame */
.paper,.card,.tinfo,.crew,.offer,.ritem,.steps li,.memo,.relic,.meter,.toast,.btn,.intel{clip-path:var(--notch)}
.paper,.card,.tinfo,.steps li,.ritem,.relic{background:var(--panel);box-shadow:var(--frame),inset 0 calc(var(--b) * 2) 0 0 rgba(255,255,255,.04)}

.lbl{font:400 10px/1.2 var(--f-label);letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.lbl .mono{font:400 16px/1 var(--f-mono);color:var(--fg);letter-spacing:0;text-transform:none}
.val{font:400 17px/1.15 var(--f-body)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.val.mono{font:400 26px/.9 var(--f-mono)}
.hud-block{display:flex;flex-direction:column;gap:4px;min-width:0}
.hud-block .val{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.hud-meter{display:flex;flex-direction:column;gap:5px;flex:1 1 150px;min-width:130px;max-width:280px}
.meter{height:16px;padding:4px;background:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.meter i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--fill,var(--brand)) 0 5px,transparent 5px 7px);transition:width .2s steps(4)}
.meter.m-margin i{--fill:var(--ok)}
.meter.m-margin.warn i{--fill:var(--brand)}
.meter.m-margin.crit i{--fill:var(--danger)}
.hud-ctrl{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}

.btn{appearance:none;border:0;cursor:pointer;background:var(--brand);color:var(--brand-ink);font:700 13px/1 var(--f-label);letter-spacing:.02em;text-transform:uppercase;padding:13px 18px 15px;box-shadow:inset 0 calc(var(--b) * -1) 0 0 rgba(0,0,0,.32),inset 0 var(--b) 0 0 rgba(255,255,255,.45)}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 var(--b) 0 0 rgba(0,0,0,.28)}
.btn.ghost{background:var(--panel2);color:var(--fg);box-shadow:var(--frame),inset 0 calc(var(--b) * -2) 0 0 rgba(0,0,0,.3)}
.btn.ghost:hover{filter:none;box-shadow:inset 0 0 0 var(--b) var(--line-hi),inset 0 calc(var(--b) * -2) 0 0 rgba(0,0,0,.3)}
.btn.sm{font-size:11px;padding:9px 11px 11px}
.btn.on{background:var(--fg);color:var(--bg);box-shadow:inset 0 calc(var(--b) * -1) 0 0 rgba(0,0,0,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.btn:focus-visible,.crew:focus-visible,.offer:focus-visible,.xbtn:focus-visible{outline:2px dashed var(--fg);outline-offset:-7px}

/* crew roster */
.roster{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.crew{flex:0 0 auto;display:grid;grid-template-columns:30px auto;gap:3px 9px;align-items:center;text-align:left;cursor:pointer;border:0;background:var(--panel);box-shadow:var(--frame);padding:7px 12px 7px 7px;min-width:140px}
.crew:hover{box-shadow:inset 0 0 0 var(--b) var(--line-hi)}
.crew.sel{background:var(--panel2);box-shadow:inset 0 0 0 var(--b) var(--brand)}
.crew.used{opacity:.5}
.crew.down{box-shadow:inset 0 0 0 var(--b) var(--danger);opacity:.65}
.crew .nm{font:400 14px/1.1 var(--f-body);white-space:nowrap}
.crew .meta{font:400 16px/1 var(--f-mono);color:var(--muted);white-space:nowrap}
.pt{width:30px;height:30px;flex:none;image-rendering:crisp-edges;image-rendering:pixelated;background:color-mix(in srgb,var(--rc) 22%,var(--panel2));outline:2px solid var(--rc);outline-offset:-2px}
.pt.big{width:44px;height:44px}
.crew .pt{grid-row:span 2}
.ritem .pt{width:36px;height:36px}
.ticker{overflow:hidden;white-space:nowrap;font:400 17px/1.3 var(--f-mono);color:var(--muted);border-top:2px dashed var(--line);padding-top:4px}
.ticker span{display:inline-block;padding-left:100%;animation:tick 70s linear infinite}
.ticker b{color:var(--brand);font-weight:400}
@keyframes tick{to{transform:translateX(-100%)}}

/* windows */
.screen{position:absolute;inset:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;background:rgba(8,10,20,.55)}
.screen.clear{background:rgba(8,10,20,.4)}
.paper{--pad:clamp(16px,3.5vw,28px);width:min(760px,100%);padding:var(--pad);display:flex;flex-direction:column;gap:16px;margin:auto 0}
.titlebar{display:flex;align-items:center;gap:12px;margin:calc(var(--pad) * -1) calc(var(--pad) * -1) 0;padding:8px 8px 8px var(--pad);background:var(--line);font:400 10px/1 var(--f-label);letter-spacing:.04em;color:var(--fg);text-transform:uppercase}
.titlebar i{flex:1;height:7px;background:repeating-linear-gradient(180deg,var(--line-hi) 0 1px,transparent 1px 3px)}
.xbtn{appearance:none;border:0;cursor:pointer;width:22px;height:20px;background:var(--danger);color:var(--ink);font:700 11px/1 var(--f-label);box-shadow:inset 0 -2px 0 rgba(0,0,0,.3)}
.paper h2{font:400 clamp(36px,6.5vw,54px)/.95 var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance;text-shadow:3px 3px 0 var(--ink)}
.paper h3{font:400 11px/1 var(--f-label);letter-spacing:.04em;text-transform:uppercase;margin:0;color:var(--muted)}
.paper p{margin:0;max-width:65ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.memo{font:400 20px/1.2 var(--f-mono);background:#070a12;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);box-shadow:var(--frame);padding:16px 18px;white-space:pre-wrap;color:#c4f0d4}
.memo b{color:var(--brand);font-weight:400}
.memo::after{content:'\2588';color:var(--brand);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* title */
.title-wrap{display:flex;flex-direction:column;gap:20px;width:min(840px,100%);margin:auto 0}
.corp{display:flex;align-items:center;gap:10px;font:400 11px/1.2 var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.corp svg{width:33px;height:36px;flex:none}
.big{font:700 clamp(36px,8.4vw,86px)/1.02 var(--f-label);text-transform:uppercase;margin:0;text-shadow:0 6px 0 var(--ink),6px 6px 0 var(--ink)}
.big em{font-style:normal;color:var(--brand);text-shadow:0 6px 0 #6b5200,6px 6px 0 var(--ink)}
.tagline{font:400 clamp(15px,2.3vw,19px)/1.35 var(--f-body);color:var(--muted);margin:0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.steps li{padding:13px 14px 14px;font-size:15px;line-height:1.3}
.steps li b{display:block;font:400 11px/1.2 var(--f-label);letter-spacing:.03em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
.colony{font:400 18px/1.2 var(--f-mono);color:var(--muted)}
.lineup{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.lineup img{width:42px;height:57px;image-rendering:crisp-edges;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.lineup figcaption{width:100%;font:400 10px/1.4 var(--f-label);color:var(--muted);letter-spacing:.03em;text-transform:uppercase;order:2;padding-top:8px}

/* contract window on the star map */
.card{--pad:18px;position:absolute;right:12px;top:12px;width:min(370px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;padding:var(--pad);display:flex;flex-direction:column;gap:12px}
.card h2{font:400 40px/.95 var(--f-display);margin:0;text-shadow:3px 3px 0 var(--ink)}
.card .sub{font:400 10px/1.3 var(--f-label);color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:15px;margin:0}
.kv dt{font:400 9px/1.9 var(--f-label);letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;min-width:0}
.kv dd.mono{font-size:20px;line-height:1}
.pill{display:inline-block;font:400 9px/1 var(--f-label);letter-spacing:.03em;text-transform:uppercase;padding:5px 7px;margin-top:3px;box-shadow:inset 0 0 0 2px currentColor;background:color-mix(in srgb,currentColor 14%,transparent)}
.pill.good{color:var(--ok)}.pill.bad{color:var(--danger)}.pill.neutral{color:var(--muted)}
.intel{font:400 18px/1.15 var(--f-mono);color:var(--brand);background:rgba(255,210,63,.08);padding:8px 12px 9px 14px;box-shadow:inset var(--b) 0 0 0 var(--brand)}
.wavehint{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:2px;max-width:min(420px,60%);font:400 18px/1.15 var(--f-mono);color:#ff9ff0;background:rgba(5,7,10,.78);padding:6px 10px 7px;box-shadow:inset 3px 0 0 #ff3ad6;pointer-events:none}
.shipbtn{position:absolute;right:14px;bottom:14px}
.shipui{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,94%);display:flex;justify-content:center}
.shipprompt{background:rgba(12,14,20,.92);box-shadow:var(--frame);padding:8px 12px;font:400 17px/1.3 var(--f-mono);color:var(--fg);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.shipprompt.dim{color:var(--muted)}
.shippanel{position:relative;max-height:min(70vh,560px);overflow:auto;width:100%}
.maphint{position:absolute;left:12px;bottom:12px;font:400 19px/1.2 var(--f-mono);color:var(--muted);pointer-events:none;max-width:60%;text-shadow:2px 2px 0 var(--ink)}

/* email + payslip */
.mailhead{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font:400 19px/1.15 var(--f-mono);color:var(--muted);border-bottom:2px dashed var(--line);padding-bottom:12px}
.mailhead b{color:var(--fg);font-weight:400}
.mailbody{display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.5}
.slip{width:100%;border-collapse:collapse;font:400 20px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.slip td{padding:5px 0;border-bottom:2px dotted var(--line)}
.slip td:last-child{text-align:right}
.slip tr.neg td:last-child{color:var(--danger)}
.slip tr.tot td{border-bottom:0;border-top:3px solid var(--fg);color:var(--brand);padding-top:8px}

/* store */
.store{width:min(1000px,100%);display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin:auto 0}
.store > .paper{margin:0;align-self:start}
@media (max-width:760px){.store{grid-template-columns:minmax(0,1fr)}}
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.offer{display:flex;flex-direction:column;gap:7px;text-align:left;border:0;background:var(--panel2);box-shadow:var(--frame),inset 0 calc(var(--b) * -2) 0 0 rgba(0,0,0,.25);padding:13px 13px 15px;cursor:pointer}
.offer:hover:not(:disabled){box-shadow:inset 0 0 0 var(--b) var(--brand),inset 0 calc(var(--b) * -2) 0 0 rgba(0,0,0,.25);transform:translateY(-2px)}
.offer:disabled{opacity:.4;cursor:not-allowed}
.offer .k{font:400 9px/1.2 var(--f-label);letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.offer .t{font:400 27px/.95 var(--f-display)}
.offer .d{font-size:13.5px;line-height:1.4;color:#c5cbe6;flex:1}
.arch{display:block;font-size:13px;line-height:1.35;color:#dfe4f5}.arch small{color:#aab3d4}
.lean{font:400 9px/1 var(--f-label);font-style:normal;text-transform:uppercase;letter-spacing:.04em;color:var(--lc);border:1px solid var(--lc);padding:2px 4px;vertical-align:1px}
.offer .p{font:400 22px/1 var(--f-mono);color:var(--brand)}
.offer.sold{opacity:.35;pointer-events:none}
.rlist{display:flex;flex-direction:column;gap:6px}
.ritem{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:15px}
.ritem .grow{flex:1;min-width:0}
.ritem small{display:block;font:400 16px/1.05 var(--f-mono);color:var(--muted)}
.ritem .btn{padding:7px 9px 9px;font-size:10px}
.relics{display:flex;flex-wrap:wrap;gap:6px}
.relic{font:400 17px/1 var(--f-mono);padding:7px 10px 8px;cursor:help}
.scrip{font:400 52px/.8 var(--f-mono);color:var(--brand);text-shadow:3px 3px 0 var(--ink)}

/* envoy call */
.paper.envoy{width:min(900px,100%);gap:14px}
.envoy-scene{position:relative;background:#000;box-shadow:var(--frame);padding:var(--b);width:min(100%,calc(44vh * 1.786));margin:0 auto}
.envoy-scene canvas{display:block;width:100%;aspect-ratio:200/112;image-rendering:crisp-edges;image-rendering:pixelated}
.envoy-tag{position:absolute;left:14px;bottom:12px;display:flex;flex-direction:column;gap:3px;background:rgba(5,7,10,.82);padding:7px 11px 8px;box-shadow:inset 3px 0 0 var(--ec)}
.kv.score{margin:0}.kv.score dd i{color:var(--line);font-style:normal}
.mgr .deal:first-child{position:relative}.grade{position:absolute;right:12px;top:10px;font:400 54px/1 var(--f-display);color:var(--gc);text-shadow:3px 3px 0 var(--ink)}.grade small{display:block;font:400 9px/1 var(--f-label);text-transform:uppercase;color:var(--muted);text-align:center}
.kv.score .ok{color:var(--ok)}.kv.score .no{color:var(--danger)}
.btn.exec{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;width:100%;margin-top:6px;white-space:normal}.btn.exec span{font:400 14px/1.3 var(--f-mono);text-transform:none;letter-spacing:0}.btn.exec.picked{outline:3px solid var(--crystal)}
.envoy-tag b{font:400 28px/.9 var(--f-display);color:var(--ec);font-weight:400}
.envoy-tag span{font:400 9px/1.2 var(--f-label);letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.envoy-beat{position:absolute;right:14px;top:12px;font:400 10px/1 var(--f-label);letter-spacing:.04em;text-transform:uppercase;background:rgba(5,7,10,.82);padding:6px 9px;color:var(--fg)}
.envoy-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.envoy-grid{grid-template-columns:minmax(0,1fr)}.envoy-tag{position:static;margin-top:var(--b)}.envoy-beat{top:8px;right:8px}}
.envoy-talk{display:flex;flex-direction:column;gap:8px}
.dialog{font:400 20px/1.2 var(--f-mono);background:#070a12;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);box-shadow:var(--frame);padding:14px 16px;color:#e6dcc4;min-height:190px;cursor:pointer;display:flex;flex-direction:column;gap:10px;clip-path:var(--notch)}
.dialog p{margin:0}
.envoy-offer{display:flex;flex-direction:column;gap:9px}
.deal{padding:9px 12px 10px;background:var(--panel2);box-shadow:inset var(--b) 0 0 0 var(--dc,var(--line));clip-path:var(--notch)}
.deal p{margin:3px 0 0;font-size:14.5px;line-height:1.4}
.deal.ask{--dc:var(--brand)}.deal.reward{--dc:var(--ok)}.deal.risk{--dc:var(--danger)}
.meter.m-heat i{--fill:var(--danger)}
.btn.danger{background:var(--danger);color:var(--ink)}
.deal-hud .val{color:var(--ok)}
.offer.black{background:#0e0f18;box-shadow:inset 0 0 0 var(--b) #ff5d73,inset 0 calc(var(--b) * -2) 0 0 rgba(0,0,0,.25)}
.offer.black .k{color:#ff5d73}

/* juice: entrances, wipes, counters, confetti, banners */
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{0%{opacity:0;transform:translateY(12px) scale(.94)}70%{opacity:1;transform:translateY(-2px) scale(1.01)}100%{opacity:1;transform:none}}
.screen{animation:fadein .25s ease-out both}
.screen > .paper,.store > .paper,.card,.title-wrap{animation:rise .38s cubic-bezier(.2,.9,.3,1.15) both}
.pop-in{animation:popin .42s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d,0ms)}
.wipe{position:absolute;inset:0;pointer-events:none;z-index:40;display:flex;flex-direction:column}
.wipe i{flex:1;background:var(--ink);transform:scaleX(0);transform-origin:right}
.wipe.go i{animation:wipeaway .36s cubic-bezier(.7,0,.3,1) both;animation-delay:calc(var(--k) * 22ms)}
@keyframes wipeaway{0%{transform:scaleX(1);transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}
.cf{position:absolute;width:6px;height:6px;pointer-events:none;z-index:45;margin:-3px 0 0 -3px}
.banner{position:absolute;left:0;right:0;top:34%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 16px 12px;pointer-events:none;z-index:42;background:linear-gradient(90deg,transparent,rgba(5,7,10,.88) 18%,rgba(5,7,10,.88) 82%,transparent);border-block:3px solid var(--bc);opacity:0;transform:scaleY(0)}
.banner b{font:400 clamp(30px,6vw,52px)/.9 var(--f-display);color:var(--bc);text-shadow:3px 3px 0 var(--ink);text-transform:uppercase;letter-spacing:.02em}
.banner span{font:400 11px/1.2 var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
.banner.show{animation:bannerin 1.9s cubic-bezier(.2,.9,.3,1.1) both}
.banner.danger{background:repeating-linear-gradient(-45deg,rgba(90,10,20,.9) 0 14px,rgba(20,4,8,.9) 14px 28px)}
@keyframes bannerin{0%{opacity:0;transform:scaleY(0)}10%{opacity:1;transform:scaleY(1.15)}16%{transform:scaleY(1)}85%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(0)}}
.banner.show b{animation:bannertxt 1.9s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes bannertxt{0%{transform:translateX(-60px);letter-spacing:.3em}16%{transform:none;letter-spacing:.02em}85%{transform:none}100%{transform:translateX(60px)}}
.bump{animation:bump .35s cubic-bezier(.3,1.6,.5,1)}

function companyLedger(c, m, net) {
  const billed = Math.round((50 + 12 * c.idx) * c.pay * (34 + 6 * sectorOf(c.idx)) * (c.client.good ? 0.8 : 1.35));
  const leftover = Math.max(0, Math.round(m.budget));
  // the reclaimed budget, split between three line items
  const items = shuffle([...EXEC_SPEND]).slice(0, 3), w = [0.5 + rnd() * 0.2, 0.2 + rnd() * 0.1]; w.push(Math.max(0.05, 1 - w[0] - w[1]));
  const spend = items.map((k, i) => [k, Math.round(leftover * w[i])]);
  if (spend.length) spend[0][1] += leftover - spend.reduce((s, x) => s + x[1], 0);
  const share = net / Math.max(1, billed + leftover) * 100;
  return { billed, leftover, spend: leftover ? spend : [], share };
}

function hurtTower(tw, dmg) {

}

function advanceAlong(e, dist) {

  while (dist > 0 && e.wi < e.path.length - 1) {
    const tp = e.path[e.wi], d = Math.hypot(tp.x - e.x, tp.y - e.y);
    if (d <= dist) { e.x = tp.x; e.y = tp.y; e.wi++; dist -= d; e.dist += d; }
    else { e.x += (tp.x - e.x) / d * dist; e.y += (tp.y - e.y) / d * dist; e.dist += dist; dist = 0; }
  }
}
function crewNear(e, r) { return M.towers.filter(tw => !tw.down && Math.hypot(tw.x - e.x, tw.y - e.y) <= r * TILE); }
function enemyShot(e, tw, dmg, col) {

// per-step behaviour for the new hostile types, elite traits and boss mechanics

      fxText(e.x, ecy(e) - 30, 'THE CROWD SPLITS', '#ff7ac8');

        for (let i = 0; i < e.bubble.n; i++) { const a = spawnEnemy({ cat: e.bubble.cat, tier: 1, sp: e.sp }); a.x = e.x + (rnd() - 0.5) * 34; a.y = e.y + (rnd() - 0.5) * 34; a.wi = e.wi; a.dist = e.dist; e.guards.push(a); }
        fxText(e.x, ecy(e) - 34, M.c.facKey === 'rival' ? 'INJUNCTION FILED' : 'VAULT SEALED', '#ffd23f'); sfx('stamp', e.x);
      }

function reviewOptions(cr, r) {
  const tier = tierFor(r, cr), owned = new Set(cr.perks);
  const fits = p => (!p.role || p.role === cr.type) && !owned.has(p.id);
  const draw = (list, n) => shuffle(list.filter(fits)).slice(0, n).map(p => p.id);
  let opts;
  if (tier === 'spec') opts = BRANCHES[cr.type].map(b => b.id);
  else if (tier === 'cap') opts = [BRANCH[cr.spec].cap, ...draw(PERKS.filter(p => p.tier === 't2'), 2)];
  else if (tier === 'exec') opts = draw(PERKS.filter(p => p.tier === 'exec' || p.tier === 't2'), 3);
  else {
    // lean towards the role's own perks, topped up with corporate ones
    const role = draw(PERKS.filter(p => p.tier === tier && p.role), 2);
    opts = role.concat(draw(PERKS.filter(p => p.tier === tier && !p.role), 3 - role.length));
  }
  while (opts.length < (tier === 'spec' ? 2 : 3)) opts.push('raise');

}

// ---------- review window ----------
function showReview(cr) {
  if (!cr || !cr.reviews || !cr.reviews.length) return;
  if (!S.reviewOpen) { S.revPaused = M ? M.paused : null; if (M) M.paused = true; }
  S.reviewOpen = cr.id;
  const r = cr.reviews[0], tier = tierFor(r, cr), T = TIER_INFO[tier];
  if (!cr.opts) cr.opts = reviewOptions(cr, r);
  const cards = cr.opts.map(id => {
    const p = perkDef(id), pt = TIER_INFO[p.tier] || TIER_INFO.t1;
    const extra = BRANCH[id] ? `<span class="cap">Rank 5 capstone: ${esc(PERK[BRANCH[id].cap].name)}. ${esc(PERK[BRANCH[id].cap].desc)}</span>` : '';
    return `<button class="perk" data-act="pickperk" data-id="${id}" style="--tc:${pt.col}"><span class="k">${esc(pt.label)}${p.role ? '' : ' · Corporate'}</span><span class="t">${esc(p.name)}</span><span class="d">${esc(p.desc)}</span>${extra}</button>`;
  }).join('');

    <p>${esc(T.blurb)}</p>

    <div class="row">
      ${tier === 'spec' ? '' : `<button class="btn ghost sm" data-act="appeal" ${RUN.scrip < cost ? 'disabled' : ''}>Appeal decision · ${cost} scrip</button>`}
      <button class="btn ghost sm" data-act="decline">Decline promotion · +12 scrip</button>

function closeReview(snooze) {

}

  const cr = RUN.roster.find(c => c.id === S.reviewOpen);
  if (cr && cr.reviews.length) { showReview(cr); return; }
  if (S.reviewFlow === 'store') { const n = RUN.roster.find(c => c.reviews.length); if (n) { S.reviewOpen = null; showReview(n); return; } }
  closeReview(false);
}
function resolveReview(id) {
  const cr = RUN.roster.find(c => c.id === S.reviewOpen); if (!cr) return;
  if (id) { pickPerk(cr, id); sfx('stamp'); toast(`${cr.name}: ${perkDef(id).name}`, 1600); }
  else { cr.reviews.shift(); cr.opts = null; RUN.scrip += 12; sfx('buy'); toast(`${cr.name} declined the promotion. +12 scrip`, 1600); }
  // a promotion mid-contract can change max HP
  if (M) { const tw = M.towers.find(t => t.crew === cr); if (tw) { const st = towerStats(cr, tw); if (!tw.down) tw.hp = tw.hp * st.maxhp / tw.maxhp; tw.maxhp = st.maxhp; } }

// ---------- finishing a mission ----------
function finishMission(success) {
  const m = M, c = m.c;
  if (c.ship) { finishSiege(success); return; }
  if (!success) { showGameOver(); return; }
  const story = resolveDeal(m);
  RUN.lastDowned = m.downed.slice();
  RUN.history.push({ planet: c.planet, faction: c.facKey, client: c.client.n, good: c.client.good, lost: m.lost, kills: m.kills, idx: c.idx });
  RUN.factionCount[c.facKey] = (RUN.factionCount[c.facKey] || 0) + 1;
  if (c.boss) { shiftStanding(c.facKey, -1, 'boss'); moraleEvent('boss', c.facKey); }
  // the planet keeps what happened to it: theirs if you honoured their deal, the company's otherwise
  const d0 = m.deal, wstate = d0 && !d0.broken && d0.fac === c.facKey ? 'helped' : 'crushed';
  (RUN.worlds = RUN.worlds || []).push({ planet: c.planet, bk: c.biomeKey, fac: c.facKey, state: wstate, idx: c.idx, v: Math.floor(c.seed * 3), lost: m.lost, kills: m.kills, act: actOf(c.idx), boss: !!c.boss, deal: d0 ? (d0.broken || 'honoured') : null, dealFac: d0 ? d0.fac : null });
  moraleEvent(wstate, c.facKey);
  if (m.lost === 0) moraleEvent('clean'); else if (m.lost >= 25) moraleEvent('bloodbath');
  if (m.downed.length) moraleEvent('grief', null, Math.min(2, m.downed.length));
  moraleEvent(c.client.good ? 'charity' : 'dirtywork', c.facKey);
  moraleDrift();
  const quits = crewQuits();
  // payslip
  const gross = Math.round((50 + 12 * c.idx) * c.pay * (has('tithe') ? 1.2 : 1));
  const lines = [['Base contract fee', gross], ['Pacification incentive (' + m.kills + ' incidents)', Math.floor(m.kills * 0.25)]];
  if (m.lost === 0) lines.push(['Zero-loss bonus', 25]);
  const ded = shuffle([...DEDUCTIONS]).slice(0, ri(2, 3)).map(d => [d, -ri(3, 9)]);
  for (const cr of RUN.roster) if (cr.dead) { const old = cr.name; replaceCrew(cr, true); ded.push([`Replacement hire for ${old}`, -15]); }
  const all = lines.concat(ded);
  let net = all.reduce((s, l) => s + l[1], 0);
  if (net < 10) { all.push(['Minimum wage adjustment (reluctant)', 10 - net]); net = 10; }
  // a hot enough employee gets audited, which is expensive and cools things down
  const st = RUN.story;
  if (st.heat >= 75) { const fee = Math.min(25, net); all.push(['Internal audit (suspicion surcharge)', -fee]); net -= fee; st.heat -= 30; story.push({ audit: true }); }
  st.heat = Math.max(0, st.heat - 5);
  RUN.scrip += net;
  const ledger = companyLedger(c, m, net); noteContract(c, m, ledger, wstate);
  if (c.boss) { if (sectorOf(c.idx) < MAX_SECTOR) { RUN.idx++; showSectorComplete(c, net, ledger); } else showVictory(); return; }
  RUN.idx++;
  showDebrief({ c, ledger, lost: m.lost, kills: m.kills, promos: m.promos, downed: m.downed, replacements: m.replacements || [], quits, dividend: m.dividendPaid || 0, slip: all, net, story: story.filter(e => !e.audit), audited: story.some(e => e.audit) });
}

// PLANET SCENES. A pixel-art postcard of every world, for every faction that can invade it, in
// three states: unresolved (the faction is there and the drill is contested), helped (you sided
// with them and the planet is theirs now) and crushed (Kindly won). Built from each biome's own
// ground, props, buildings, landmark and weather, so every scene matches the map you played.
// ================================================================
const SCENE_W = 200, SCENE_H = 100, SCENE_HZ = 44;
const SCENES = new Map();
const KINDLY_Y = '#ffd23f';
// the sky: a dithered gradient from each biome's colour grade, plus what hangs in it
function sceneSky(g, bk, act = 1) {
  const A = BIOME_ART[bk], AS = ACTS[act] && ACTS[act].sky, steps = 6;
  let top = shade(A.grade[1], -0.55), bot = mixHex(A.grade[1], A.grade[0], 0.5);
  if (AS) { top = mixHex(top, AS[0], 0.6); bot = mixHex(bot, AS[1], 0.55); }
  for (let y = 0; y < SCENE_HZ; y++) {
    const k = y / (SCENE_HZ - 1) * (steps - 1), b = Math.floor(k), f = k - b;
    const c0 = mixHex(top, bot, b / (steps - 1)), c1 = mixHex(top, bot, Math.min(1, (b + 1) / (steps - 1)));
    for (let x = 0; x < SCENE_W; x++) px(g, x, y, 1, 1, (f > 0.5 ? ((x + y) % 2 === 0 || f > 0.8) : (f > 0.25 && (x + y) % 4 === 0)) ? c1 : c0);
  }
  const star = n => { for (let i = 0; i < n; i++) px(g, ri(0, SCENE_W - 1), ri(0, SCENE_HZ - 12), 1, 1, rnd() < 0.3 ? '#ffffff' : 'rgba(255,255,255,0.55)'); };
  const sil = (base, amp, col, step = 1) => { let h = amp / 2; for (let x = 0; x < SCENE_W; x += step) { h = clamp(h + (rnd() - 0.5) * amp * 0.5, 2, amp); px(g, x, SCENE_HZ - Math.round(h) - base, step, Math.round(h) + base, col); } };
  switch (bk) {
    case 'frozen': star(10); sil(0, 16, '#a8c4dc', 2); for (let x = 0; x < SCENE_W; x += 2) px(g, x, SCENE_HZ - 3, 2, 3, '#7a98b4'); break;

function planetAt(p) {

let last = performance.now(), acc = 0;
// the next frame is booked first, so one bad frame can never stop the game; errors are reported once each
const FRAME_ERRORS = new Set();
function reportFrameError(e) {

  try { if (ctx.reset) ctx.reset(); else { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; } } catch (e2) { }
  const msg = (e && e.message) || String(e), where = ((e && e.stack) || '').split('\n').slice(1, 4).map(l => (l.match(/at (\S+)/) || [])[1] || '').filter(Boolean).join(' < ');
  console.error('frame error', e);
  if (FRAME_ERRORS.has(msg)) return; FRAME_ERRORS.add(msg);
  S.lastError = `${msg} ${where.trim()}`;
  try { toast(`Something broke (${msg}). The game kept running. Tell the developer: ${where.trim().slice(0, 60)}`, 6000); } catch (e2) { }
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  try {

      if (!M.paused) { acc += dt * M.speed; let n = 0; while (acc >= STEP && n++ < 12) { stepMission(STEP); acc -= STEP; if (!M) break; } if (n >= 12) acc = 0; }
      if (M && S.screen === 'mission') { AU.intensity = M.t / M.T; renderMission(now); updateHud(); }
    } else if (S.screen === 'map') renderMap(now);
    else if (S.screen === 'ship') renderShip(now, dt);
    else { beginDraw(); drawStars(now / 1000); if (S.screen === 'envoy') drawEnvoyFrame(now); else if (S.screen === 'manager') drawManagerFrame(now); }

}

// indigo, lit from inside by crystal veins, wearing woven glass-thread and carrying lanterns.

const KIN_SKIN = ['#3a2e6a', '#2e3a72', '#4a2a6a', '#24406a', '#3a2a5a'];
const KIN_ROBE = ['#d8d0b8', '#9ad0c8', '#e8c8e0', '#c8d8f0', '#b8c8a8'];
const KIN_GLOW = '#7fe8ff', KIN_HOT = '#e8ffff';
const kinPal = (dark) => ({ skin: dark ? '#1a1630' : pick(KIN_SKIN), robe: dark ? '#2a2840' : pick(KIN_ROBE), trim: pick(['#5ab8c8', '#c87ab8', '#7ab87a', '#c8a85a']), glow: dark ? '#3a6a7a' : KIN_GLOW });
// one Kin on foot, four-frame stride; `cat` decides what they carry and how they stand
function kinUnit(cat, f, pal = kinPal(cat === 'stealth')) {

  for (let y = 10; y < 19; y++) { const w = 4 + Math.floor((y - 10) / 2.4); P.r(hx - (w >> 1) - (y > 15 ? lean : 0), y + bob, w, 1, y === 13 || y === 17 ? trim : y > 15 ? rd : robe); }
  leg(8, ph, skin);
  // neck, head (long, narrow), crown of crystal growths, glowing eyes and veins
  P.r(hx, 8 + bob + tall, 2, 2, skin);
  P.ell(hx + 1, 5 + bob + tall, 2.6, 3.6, skin); P.p(hx - 1, 6 + bob + tall, sd);
  for (const [dx, h] of [[-1, 2], [1, 3], [3, 2]]) { P.r(hx + dx, 1 + bob + tall - (h - 2), 1, h, glow); P.p(hx + dx, 1 + bob + tall - (h - 2), KIN_HOT); }
  P.p(hx + 2, 5 + bob + tall, KIN_HOT); P.p(hx + 3, 5 + bob + tall, glow);
  P.p(hx, 7 + bob + tall, glow); P.p(hx + 1, 11 + bob, glow); P.p(hx - 1, 14 + bob, glow);
  // the near arm, reaching to the hand at (12, 13)

    case 'fast': P.r(hx - 4, 11 + bob, 2, 4, trim); break;
    case 'saboteur': P.line(ax, hy - 8, ax, hy + 8, '#8a7a6a'); P.r(ax - 1, hy - 10, 3, 3, glow); P.p(ax, hy - 10, KIN_HOT); L.push({ x: ax, y: hy - 9, color: glow, r: 9 }); break;
    case 'medic': P.ell(ax, hy, 2, 2, KIN_HOT); P.p(hx - 3, 13 + bob, KIN_HOT); L.push({ x: ax, y: hy, color: '#b8fff0', r: 14, pulse: true }); break;
    case 'shield': for (let y = 0; y < 12; y++) P.r(ax + 1, hy - 7 + y, 3, 1, y % 3 ? 'rgba(127,232,255,0.55)' : 'rgba(232,255,255,0.8)'); P.r(ax + 1, hy - 7, 3, 1, KIN_HOT); P.r(ax + 4, hy - 7, 1, 12, '#5ab8c8'); break;
    case 'splitter': P.p(hx + 4, 3 + bob, glow); P.p(hx + 6, 2 + bob, glow); P.p(hx + 5, 5 + bob, KIN_HOT); break;
    case 'stealth': break;
    case 'jammer': P.line(ax, hy - 7, ax, hy + 8, '#8a7a6a'); P.r(ax - 1, hy - 9, 1, 3, glow); P.r(ax + 1, hy - 9, 1, 3, glow); P.p(ax, hy - 7, KIN_HOT); L.push({ x: ax, y: hy - 8, color: glow, r: 8, pulse: true }); break;
    case 'ranged': P.line(ax, hy, ax + 2, hy - 5, '#c8b898'); P.ell(ax + 2, hy - 6, 1.2, 1.2, KIN_HOT); L.push({ x: ax + 2, y: hy - 6, color: glow, r: 7 }); break;
    case 'carrier': P.line(ax, hy - 11, ax, hy + 9, '#9a8a6a'); P.ell(ax, hy - 12, 2.2, 2.6, glow); P.p(ax, hy - 13, KIN_HOT); P.r(hx - 3, 9 + bob, 6, 1, trim); L.push({ x: ax, y: hy - 12, color: glow, r: 14 }); break;
    case 'blinker': for (const [dx, dy] of [[-5, -2], [5, -4], [-4, 6]]) { P.p(hx + dx, 10 + dy + bob, KIN_HOT); P.p(hx + dx + 1, 10 + dy + bob, glow); } L.push({ x: hx, y: 10, color: '#c8b8ff', r: 12, pulse: true }); break;
    case 'berserk': P.line(ax, hy, ax + 4, hy - 4, glow); P.line(hx - 3, 12 + bob, hx - 6, 9 + bob, glow); P.p(ax + 4, hy - 4, KIN_HOT); P.p(hx - 6, 9 + bob, KIN_HOT); break;

}

// ---------- rideable platforms ----------
// Each platform is drawn in two layers around its rider: the full sprite first, then the rider standing
// on the deck row, then the front layer (rows from `split` down: gunwale, basket, near lip) over the
// rider's boots. `deck` is the sprite row the rider's feet rest on and is also the anchor row.
// Hovering platforms float `lift` pixels up and bob; boats sit on the water and rock.
const RIDE = {
  ray: { lift: 5, hover: true, paint(P, f) {
    const w = [0, -2, 0, 2][f % 4], cx = 16;
    P.line(cx, 6, cx + 1, 2, '#2a7a5e'); P.line(cx + 1, 2, cx + 3, 0, '#2a7a5e');
    for (let x = 1; x <= 31; x++) {
      const d = Math.abs(x - cx), h = Math.max(0, Math.round(5.4 - d / 3)), yo = Math.round(w * Math.max(0, d - 4) / 10);
