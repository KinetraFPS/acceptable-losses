<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Acceptable Losses</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Jersey+10&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: one-screen game. HUD strip on top, framed playfield, crew roster + news ticker below.
   Pixel UI: notched 3px frames, bevelled buttons, segmented meters, window title bars on every panel. */
:root{
  --bg:#0a0c16;
  --panel:#141829;
  --panel2:#1c2240;
  --line:#323b66;
  --line-hi:#4f5a96;
  --ink:#05070a;
  --fg:#e8ecf8;
  --muted:#8a93bd;
  --brand:#ffd23f;
  --brand-ink:#231a00;
  --danger:#ff4d6d;
  --ok:#4fe0a6;
  --crystal:#b98cff;
  --f-display:'Jersey 10','Arial Narrow',sans-serif;
  --f-body:'DotGothic16',system-ui,sans-serif;
  --f-label:'Silkscreen','Courier New',monospace;
  --f-mono:'VT323',ui-monospace,Menlo,monospace;
  --b:3px;
  --notch:polygon(0 var(--b),var(--b) var(--b),var(--b) 0,calc(100% - var(--b)) 0,calc(100% - var(--b)) var(--b),100% var(--b),100% calc(100% - var(--b)),calc(100% - var(--b)) calc(100% - var(--b)),calc(100% - var(--b)) 100%,var(--b) 100%,var(--b) calc(100% - var(--b)),0 calc(100% - var(--b)));
  --frame:inset 0 0 0 var(--b) var(--line);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--bg);background-image:radial-gradient(rgba(140,150,220,.07) 1px,transparent 1.2px);background-size:9px 9px;color:var(--fg);font:15px/1.5 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;font-variant-ligatures:none}
button,input{font-variant-ligatures:none}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;min-height:0}
#hud:empty{display:none}
#stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
#cv{display:block;touch-action:none}
#cv.framed{box-shadow:0 0 0 3px var(--line),0 0 0 6px var(--ink)}
#overlay{position:absolute;inset:0;pointer-events:none}
#overlay > *{pointer-events:auto}
#bar{display:flex;flex-direction:column;gap:6px;min-width:0}
#bar:empty{display:none}

/* shared pixel frame */
.paper,.card,.tinfo,.crew,.offer,.ritem,.steps li,.memo,.relic,.meter,.toast,.btn,.intel{clip-path:var(--notch)}
.paper,.card,.tinfo,.steps li,.ritem,.relic{background:var(--panel);box-shadow:var(--frame),inset 0 calc(var(--b) * 2) 0 0 rgba(255,255,255,.04)}

.lbl{font:400 10px/1.2 var(--f-label);letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.lbl .mono{font:400 16px/1 var(--f-mono);color:var(--fg);letter-spacing:0;text-transform:none}
.val{font:400 17px/1.15 var(--f-body)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.val.mono{font:400 26px/.9 var(--f-mono)}
.hud-block{display:flex;flex-direction:column;gap:4px;min-width:0}
.hud-block .val{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.hud-meter{display:flex;flex-direction:column;gap:5px;flex:1 1 150px;min-width:130px;max-width:280px}
.meter{height:16px;padding:4px;background:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.meter i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--fill,var(--brand)) 0 5px,transparent 5px 7px);transition:width .2s steps(4)}
.meter.m-margin i{--fill:var(--ok)}
.meter.m-margin.warn i{--fill:var(--brand)}
.meter.m-margin.crit i{--fill:var(--danger)}
.hud-ctrl{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}

.btn{appearance:none;border:0;cursor:pointer;background:var(--brand);color:var(--brand-ink);font:700 13px/1 var(--f-label);letter-spacing:.02em;text-transform:uppercase;padding:13px 18px 15px;box-shadow:inset 0 calc(var(--b) * -1) 0 0 rgba(0,0,0,.32),inset 0 var(--b) 0 0 rgba(255,255,255,.45)}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 var(--b) 0 0 rgba(0,0,0,.28)}
.btn.ghost{background:var(--panel2);color:var(--fg);box-shadow:var(--frame),inset 0 calc(var(--b) * -2) 0 0 rgba(0,0,0,.3)}
.btn.ghost:hover{filter:none;box-shadow:inset 0 0 0 var(--b) var(--line-hi),inset 0 calc(var(--b) * -2) 0 0 rgba(0,0,0,.3)}
.btn.sm{font-size:11px;padding:9px 11px 11px}
.btn.on{background:var(--fg);color:var(--bg);box-shadow:inset 0 calc(var(--b) * -1) 0 0 rgba(0,0,0,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.btn:focus-visible,.crew:focus-visible,.offer:focus-visible,.xbtn:focus-visible{outline:2px dashed var(--fg);outline-offset:-7px}

/* crew roster */
.roster{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.crew{flex:0 0 auto;display:grid;grid-template-columns:30px auto;gap:3px 9px;align-items:center;text-align:left;cursor:pointer;border:0;background:var(--panel);box-shadow:var(--frame);padding:7px 12px 7px 7px;min-width:140px}
.crew:hover{box-shadow:inset 0 0 0 var(--b) var(--line-hi)}
.crew.sel{background:var(--panel2);box-shadow:inset 0 0 0 var(--b) var(--brand)}
.crew.used{opacity:.5}
.crew.down{box-shadow:inset 0 0 0 var(--b) var(--danger);opacity:.65}
.crew .nm{font:400 14px/1.1 var(--f-body);white-space:nowrap}
.crew .meta{font:400 16px/1 var(--f-mono);color:var(--muted);white-space:nowrap}
.pt{width:30px;height:30px;flex:none;image-rendering:crisp-edges;image-rendering:pixelated;background:color-mix(in srgb,var(--rc) 22%,var(--panel2));outline:2px solid var(--rc);outline-offset:-2px}
.pt.big{width:44px;height:44px}
.crew .pt{grid-row:span 2}
.ritem .pt{width:36px;height:36px}
.ticker{overflow:hidden;white-space:nowrap;font:400 17px/1.3 var(--f-mono);color:var(--muted);border-top:2px dashed var(--line);padding-top:4px}
.ticker span{display:inline-block;padding-left:100%;animation:tick 70s linear infinite}
.ticker b{color:var(--brand);font-weight:400}
@keyframes tick{to{transform:translateX(-100%)}}

/* windows */
.screen{position:absolute;inset:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;background:rgba(8,10,20,.55)}
.screen.clear{background:rgba(8,10,20,.4)}
.paper{--pad:clamp(16px,3.5vw,28px);width:min(760px,100%);padding:var(--pad);display:flex;flex-direction:column;gap:16px;margin:auto 0}
.titlebar{display:flex;align-items:center;gap:12px;margin:calc(var(--pad) * -1) calc(var(--pad) * -1) 0;padding:8px 8px 8px var(--pad);background:var(--line);font:400 10px/1 var(--f-label);letter-spacing:.04em;color:var(--fg);text-transform:uppercase}
.titlebar i{flex:1;height:7px;background:repeating-linear-gradient(180deg,var(--line-hi) 0 1px,transparent 1px 3px)}
.xbtn{appearance:none;border:0;cursor:pointer;width:22px;height:20px;background:var(--danger);color:var(--ink);font:700 11px/1 var(--f-label);box-shadow:inset 0 -2px 0 rgba(0,0,0,.3)}
.paper h2{font:400 clamp(36px,6.5vw,54px)/.95 var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance;text-shadow:3px 3px 0 var(--ink)}
.paper h3{font:400 11px/1 var(--f-label);letter-spacing:.04em;text-transform:uppercase;margin:0;color:var(--muted)}
.paper p{margin:0;max-width:65ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.memo{font:400 20px/1.2 var(--f-mono);background:#070a12;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);box-shadow:var(--frame);padding:16px 18px;white-space:pre-wrap;color:#c4f0d4}
.memo b{color:var(--brand);font-weight:400}
.memo::after{content:'\2588';color:var(--brand);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* title */
.title-wrap{display:flex;flex-direction:column;gap:20px;width:min(840px,100%);margin:auto 0}
.corp{display:flex;align-items:center;gap:10px;font:400 11px/1.2 var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.corp svg{width:33px;height:36px;flex:none}
.big{font:700 clamp(36px,8.4vw,86px)/1.02 var(--f-label);text-transform:uppercase;margin:0;text-shadow:0 6px 0 var(--ink),6px 6px 0 var(--ink)}
.big em{font-style:normal;color:var(--brand);text-shadow:0 6px 0 #6b5200,6px 6px 0 var(--ink)}
.tagline{font:400 clamp(15px,2.3vw,19px)/1.35 var(--f-body);color:var(--muted);margin:0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.steps li{padding:13px 14px 14px;font-size:15px;line-height:1.3}
.steps li b{display:block;font:400 11px/1.2 var(--f-label);letter-spacing:.03em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
.colony{font:400 18px/1.2 var(--f-mono);color:var(--muted)}
.lineup{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.lineup img{width:42px;height:57px;image-rendering:crisp-edges;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.lineup figcaption{width:100%;font:400 10px/1.4 var(--f-label);color:var(--muted);letter-spacing:.03em;text-transform:uppercase;order:2;padding-top:8px}

/* contract window on the star map */
.card{--pad:18px;position:absolute;right:12px;top:12px;width:min(370px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;padding:var(--pad);display:flex;flex-direction:column;gap:12px}
.card h2{font:400 40px/.95 var(--f-display);margin:0;text-shadow:3px 3px 0 var(--ink)}
.card .sub{font:400 10px/1.3 var(--f-label);color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:15px;margin:0}
.kv dt{font:400 9px/1.9 var(--f-label);letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;min-width:0}
.kv dd.mono{font-size:20px;line-height:1}
.pill{display:inline-block;font:400 9px/1 var(--f-label);letter-spacing:.03em;text-transform:uppercase;padding:5px 7px;margin-top:3px;box-shadow:inset 0 0 0 2px currentColor;background:color-mix(in srgb,currentColor 14%,transparent)}
.pill.good{color:var(--ok)}.pill.bad{color:var(--danger)}.pill.neutral{color:var(--muted)}
.intel{font:400 18px/1.15 var(--f-mono);color:var(--brand);background:rgba(255,210,63,.08);padding:8px 12px 9px 14px;box-shadow:inset var(--b) 0 0 0 var(--brand)}
.maphint{position:absolute;left:12px;bottom:12px;font:400 19px/1.2 var(--f-mono);color:var(--muted);pointer-events:none;max-width:60%;text-shadow:2px 2px 0 var(--ink)}

/* email + payslip */
.mailhead{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font:400 19px/1.15 var(--f-mono);color:var(--muted);border-bottom:2px dashed var(--line);padding-bottom:12px}
.mailhead b{color:var(--fg);font-weight:400}
.mailbody{display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.5}
.slip{width:100%;border-collapse:collapse;font:400 20px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.slip td{padding:5px 0;border-bottom:2px dotted var(--line)}
.slip td:last-child{text-align:right}
.slip tr.neg td:last-child{color:var(--danger)}
.slip tr.tot td{border-bottom:0;border-top:3px solid var(--fg);color:var(--brand);padding-top:8px}

/* store */
.store{width:min(1000px,100%);display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin:auto 0}
.store > .paper{margin:0;align-self:start}
@media (max-width:760px){.store{grid-template-columns:minmax(0,1fr)}}
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.offer{display:flex;flex-direction:column;gap:7px;text-align:left;border:0;background:var(--panel2);box-shadow:var(--frame),inset 0 calc(var(--b) * -2) 0 0 rgba(0,0,0,.25);padding:13px 13px 15px;cursor:pointer}
.offer:hover:not(:disabled){box-shadow:inset 0 0 0 var(--b) var(--brand),inset 0 calc(var(--b) * -2) 0 0 rgba(0,0,0,.25);transform:translateY(-2px)}
.offer:disabled{opacity:.4;cursor:not-allowed}
.offer .k{font:400 9px/1.2 var(--f-label);letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.offer .t{font:400 27px/.95 var(--f-display)}
.offer .d{font-size:13.5px;line-height:1.4;color:#c5cbe6;flex:1}
.offer .p{font:400 22px/1 var(--f-mono);color:var(--brand)}
.offer.sold{opacity:.35;pointer-events:none}
.rlist{display:flex;flex-direction:column;gap:6px}
.ritem{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:15px}
.ritem .grow{flex:1;min-width:0}
.ritem small{display:block;font:400 16px/1.05 var(--f-mono);color:var(--muted)}
.ritem .btn{padding:7px 9px 9px;font-size:10px}
.relics{display:flex;flex-wrap:wrap;gap:6px}
.relic{font:400 17px/1 var(--f-mono);padding:7px 10px 8px;cursor:help}
.scrip{font:400 52px/.8 var(--f-mono);color:var(--brand);text-shadow:3px 3px 0 var(--ink)}

/* tower info + toast */
.tinfo{position:absolute;left:10px;top:10px;width:min(260px,calc(100% - 20px));padding:13px;display:flex;flex-direction:column;gap:9px;font-size:14px}
.tinfo h4{margin:0;font:400 26px/.95 var(--f-display)}
.tinfo .mono{font-size:17px;line-height:1.1}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--brand);color:var(--brand-ink);font:700 12px/1.3 var(--f-label);letter-spacing:.02em;text-transform:uppercase;padding:10px 16px 12px;box-shadow:inset 0 calc(var(--b) * -1) 0 0 rgba(0,0,0,.3),inset 0 var(--b) 0 0 rgba(255,255,255,.45);pointer-events:none;text-align:center;max-width:calc(100% - 24px);transition:opacity .3s steps(3)}
.toast.hide{opacity:0}
@media (prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:0}.meter i{transition:none}.memo::after{animation:none}.offer:hover:not(:disabled){transform:none}}
@media (max-width:560px){.hud-block .val{font-size:16px;max-width:200px}.crew{min-width:124px}.big{text-shadow:0 4px 0 var(--ink),4px 4px 0 var(--ink)}}

/* settings */
#modal{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(5,7,10,.65);overflow:auto}
#modal:empty{display:none}
.cfg-btn{position:absolute;right:12px;bottom:12px;z-index:6;width:42px;height:42px;padding:0;display:grid;place-items:center}
.cfg-btn svg{width:22px;height:22px}
.settings{width:min(440px,100%);margin:0}
.set-row{display:grid;grid-template-columns:minmax(90px,120px) 1fr 52px;align-items:center;gap:12px}
.set-row label{font:400 10px/1.2 var(--f-label);letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.set-row output{font:400 22px/1 var(--f-mono);text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;margin:0;background:transparent;cursor:pointer;--v:50%}
input[type=range]::-webkit-slider-runnable-track{height:12px;background:linear-gradient(90deg,var(--brand) var(--v),var(--ink) var(--v));box-shadow:inset 0 0 0 2px var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;margin-top:-5px;border:0;background:var(--fg);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),inset 0 0 0 2px var(--ink)}
input[type=range]::-moz-range-track{height:12px;background:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
input[type=range]::-moz-range-progress{height:12px;background:var(--brand)}
input[type=range]::-moz-range-thumb{width:14px;height:22px;border:0;border-radius:0;background:var(--fg);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),inset 0 0 0 2px var(--ink)}
input[type=range]:focus-visible{outline:2px dashed var(--fg);outline-offset:3px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:16px}
.toggle input{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin:0;flex:none;cursor:pointer;background:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.toggle input:checked{background:var(--brand);box-shadow:inset 0 0 0 2px var(--brand),inset 0 0 0 6px var(--ink)}
.toggle input:focus-visible{outline:2px dashed var(--fg);outline-offset:3px}

/* performance reviews */
.review{width:min(820px,100%);margin:0}
.review h2{font-size:clamp(32px,5vw,44px)}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.perk{display:flex;flex-direction:column;gap:7px;text-align:left;border:0;cursor:pointer;background:var(--panel2);padding:14px 14px 16px;clip-path:var(--notch);box-shadow:inset 0 0 0 var(--b) var(--tc),inset 0 calc(var(--b) * -2) 0 0 rgba(0,0,0,.25)}
.perk:hover{transform:translateY(-3px);background:color-mix(in srgb,var(--tc) 12%,var(--panel2))}
.perk:focus-visible{outline:2px dashed var(--fg);outline-offset:-8px}
.perk .k{font:400 9px/1.2 var(--f-label);letter-spacing:.03em;text-transform:uppercase;color:var(--tc)}
.perk .t{font:400 27px/.95 var(--f-display)}
.perk .d{font-size:14px;line-height:1.4;color:#c5cbe6}
.perk .cap{font:400 17px/1.1 var(--f-mono);color:var(--brand)}
.crew.rev{box-shadow:inset 0 0 0 var(--b) var(--brand);opacity:1}
.crew.rev .meta{color:var(--brand)}
.traits{display:flex;flex-wrap:wrap;gap:4px}
.trait{font:400 15px/1 var(--f-mono);padding:3px 6px 4px;background:var(--ink);box-shadow:inset 0 0 0 1px var(--line);color:var(--fg)}
.trait.q{color:var(--ok)}
.trait.sp{color:var(--crystal)}
@media (prefers-reduced-motion:reduce){.perk:hover{transform:none}}
</style>

<div id="app">
  <header id="hud"></header>
  <main id="stage">
    <canvas id="cv" aria-label="Game field"></canvas>

function pathDecor(P, A, x0, y0, isP, tx, ty, lights) {
  const p0 = A.p[0];
  switch (A.path) {
    case 'snow': for (let k = 0; k < 3; k++) { const x = x0 + 3 + ri(0, 10), y = y0 + 3 + ri(0, 10); P.p(x, y, shade(p0, -0.18)); P.p(x + 2, y + 1, shade(p0, -0.18)); } break;
    case 'mud': if (rnd() < 0.4) { const x = x0 + ri(4, 13), y = y0 + ri(5, 12); P.ell(x, y, ri(2, 4), 1.5, '#2a3a1a'); P.p(x - 1, y, '#5a7a3a'); } break;

      if (isP(tx - 1, ty) === false) P.r(x0 + 1, y0, 1, ATILE, col);
      if (isP(tx + 1, ty) === false) P.r(x0 + ATILE - 2, y0, 1, ATILE, col);
      if (rnd() < 0.3) { const x = x0 + ri(4, 12), y = y0 + ri(5, 12); P.ell(x, y, 3, 1.3, '#141630'); P.r(x - 1, y, 2, 1, pick(['#ff3ad6', '#3af0ff'])); }

    case 'paver':

      for (let y = 0; y < ATILE; y += 6) for (let x = (y / 6) % 2 ? 3 : 0; x < ATILE; x += 6) { P.r(x0 + x, y0 + y, 1, 6, shade(p0, -0.16)); if (rnd() < 0.25) P.p(x0 + x, y0 + y + ri(1, 4), '#5aa04a'); }

    case 'basalt':
      for (let y = 0; y < ATILE; y += 5) for (let x = (y / 5) % 2 ? 2 : 0; x < ATILE; x += 5) { P.p(x0 + x, y0 + y, '#2e2628'); P.p(x0 + x + 1, y0 + y, '#2e2628'); }
      if (rnd() < 0.12) { const x = x0 + ri(3, 13), y = y0 + ri(4, 13); P.p(x, y, '#ff7a2a'); P.p(x + 1, y, '#ff7a2a'); lights.push({ x: x * AP, y: y * AP, color: '#ff7a2a', r: 7, flicker: true }); }

function scheduleStep(tr, step, t, spb) {
  const bars = tr.chords.length, s = step % 16, bar = Math.floor(step / 16) % bars, loop = Math.floor(step / (16 * bars)), tp = tr.transpose || 0;
  const root = tr.chords[bar][0] + tp, ch = CHORDS[tr.chords[bar][1]].map(i => root + i), mb = AU.music, on = p => p && p[s] === 'x';

  if (on(tr.snare)) { noise({ f: 1800, q: 0.8, dur: 0.12, vol: 0.26, when: t, bus: mb }); tone({ type: 'triangle', f: 220, f2: 160, dur: 0.05, vol: 0.12, when: t, bus: mb }); }

  }

  const c = AU.ctx; if (!c || !AU.track || c.state !== 'running') return;

function drawTowerPx(g, tw, t) {

  if (tw.muzzle > 0) {

function drawEnemyPx(g, e, t) {
  const v = e.v, ax = Math.round(e.x / AP), ay = Math.round(e.y / AP) + (e.fly ? -6 + Math.round(Math.sin(t * 3 + e.wob) * 1.5) : 4);

  else fi = Math.floor(e.dist / 6) % 2;

  if (e.tier === 1 || e.tier === 2) { const ol = e.tier === 2 ? v.elite[fi] : v.vet[fi]; for (const [dx, dy] of OFF4) blit(ol, dx, dy); }

// ---------- finishing a mission ----------
function finishMission(success) {
  const m = M, c = m.c;
  if (!success) { showGameOver(); return; }
  RUN.history.push({ planet: c.planet, faction: c.facKey, client: c.client.n, good: c.client.good, lost: m.lost, kills: m.kills, idx: c.idx });
  RUN.factionCount[c.facKey] = (RUN.factionCount[c.facKey] || 0) + 1;
  // payslip
  const gross = Math.round((50 + 12 * c.idx) * c.pay);
  const lines = [['Base contract fee', gross], ['Pacification incentive (' + m.kills + ' incidents)', Math.floor(m.kills * 0.25)]];
  if (m.lost === 0) lines.push(['Zero-loss bonus', 25]);
  const ded = shuffle([...DEDUCTIONS]).slice(0, ri(2, 3)).map(d => [d, -ri(3, 9)]);
  const all = lines.concat(ded);
  let net = all.reduce((s, l) => s + l[1], 0);
  if (net < 10) { all.push(['Minimum wage adjustment (reluctant)', 10 - net]); net = 10; }
  RUN.scrip += net;
  if (c.boss) { showVictory(); return; }
  RUN.idx++;
  showDebrief({ c, lost: m.lost, kills: m.kills, promos: m.promos, downed: m.downed, slip: all, net });
}

    <div class="mailhead"><span>From</span><b>HR-BOT &lt;noreply@kindly.sec&gt;</b><span>To</span><b>Employee #${RUN.empId}</b><span>Subject</span><b>${esc(subj)}</b></div>
    <div class="mailbody"><p>Dear Employee #${RUN.empId},</p>${paras.map(p => `<p>${p}</p>`).join('')}${ps ? `<p style="color:var(--muted);font-size:14px">${esc(ps)}</p>` : ''}</div>
    <h3>Payslip · Contract ${c.idx + 1}</h3>
    <table class="slip"><tbody>${d.slip.map(([k, v]) => `<tr class="${v < 0 ? 'neg' : ''}"><td>${esc(k)}</td><td>${v < 0 ? '−' : '+'}${Math.abs(v)}</td></tr>`).join('')}
    <tr class="tot"><td>Net scrip (company store only)</td><td>${d.net}</td></tr></tbody></table>
    <div class="row"><button class="btn" data-act="tostore">${pendingReviews() ? `Hold performance reviews (${pendingReviews()})` : 'Go to the Company Store'}</button><span class="mono" style="color:var(--muted);font-size:19px">Balance: ${RUN.scrip} scrip · Margin ${RUN.margin}%</span></div>
  </div></div>`;
  RUN.offers = genOffers();
}
function genOffers() {
  const offers = [];
  const types = shuffle(Object.keys(TOWERS));
  // make sure a non-owned type shows up early
  const owned = new Set(RUN.roster.map(c => c.type));
  types.sort((a, b) => owned.has(a) - owned.has(b));
  for (const t of types.slice(0, 2)) offers.push({ kind: 'hire', type: t, name: freshName(), price: HIRE_COST[t], look: genLook(), quirk: pickQuirk() });
  const relics = shuffle(Object.keys(RELICS).filter(r => !RUN.relics.includes(r))).slice(0, 2);
  for (const r of relics) offers.push({ kind: 'relic', id: r, price: ri(70, 90) });
  offers.push(rnd() < 0.5 || RUN.margin >= 90 ? { kind: 'train', price: 40 } : { kind: 'account', price: 55 });
  if (RUN.margin < 60 && !offers.some(o => o.kind === 'account')) offers.push({ kind: 'account', price: 55 });
  return offers;
}
function showStore() {
  S.screen = 'store'; clearMissionUi(); backdropView(); setMusic('menu');
  const o = RUN.offers;
  const offerHtml = o.map((it, i) => {
    let k, t, d;
    if (it.kind === 'hire') { k = 'Hire · ' + TOWERS[it.type].name; t = it.name; d = `${TOWERS[it.type].desc} Quirk: ${QUIRKS[it.quirk].name}. ${QUIRKS[it.quirk].desc}`; }
    else if (it.kind === 'relic') { k = 'Relic'; t = RELICS[it.id].name; d = RELICS[it.id].desc; }
    else if (it.kind === 'train') { k = 'Training seminar'; t = 'Leadership Webinar'; d = 'Promote one crew member a rank, with a performance review. Certificate not included.'; }
    else { k = 'Finance'; t = 'Creative Accounting'; d = 'Restore 15% profit margin. Legally grey. Ethically black.'; }
    const full = it.kind === 'hire' && RUN.roster.length >= 8;
    return `<button class="offer${it.sold ? ' sold' : ''}" data-act="buy" data-i="${i}" ${RUN.scrip < it.price || full || it.sold ? 'disabled' : ''}>
      <span class="k">${esc(k)}</span>${it.kind === 'hire' ? `<span class="row" style="gap:8px">${portraitImg({ id: 'offer-' + it.name, type: it.type, look: it.look })}<span class="t">${esc(t)}</span></span>` : `<span class="t">${esc(t)}</span>`}
      <span class="d">${esc(d)}${full ? ' Roster full (8).' : ''}</span><span class="p">${it.sold ? 'Purchased' : it.price + ' scrip'}</span></button>`;
  }).join('');
  const rosterHtml = RUN.roster.map((cr, i) => `<div class="ritem">${portraitImg(cr)}<div class="grow">${esc(cr.name)}<small>${esc(RANKS[cr.level - 1])} · ${esc(TOWERS[cr.type].name)} · Lv${cr.level} · ${cr.kills} kills</small><small style="color:var(--ok)" title="${esc(QUIRKS[cr.quirk].desc)}">${esc(QUIRKS[cr.quirk].name)}${cr.spec ? ` · <span style="color:var(--crystal)">${esc(BRANCH[cr.spec].name)}</span>` : ''}${cr.perks.length ? ` · ${cr.perks.length} perk${cr.perks.length > 1 ? 's' : ''}` : ''}</small></div>
    ${S.promotePick ? (cr.level < MAXL ? `<button class="btn sm" data-act="promote" data-i="${i}">Promote</button>` : '') : cr.reviews.length ? `<button class="btn sm" data-act="review" data-id="${cr.id}">Review</button>` : (RUN.roster.length > 1 ? `<button class="btn sm ghost" data-act="dismiss" data-i="${i}" aria-label="Dismiss ${esc(cr.name)}">Dismiss</button>` : '')}</div>`).join('');
  const relicHtml = RUN.relics.length ? RUN.relics.map(r => `<span class="relic" title="${esc(RELICS[r].desc)}">${esc(RELICS[r].name)}</span>`).join('') : '<span class="colony">No relics yet.</span>';
  $('#overlay').innerHTML = `<div class="screen"><div class="store">
    <div class="paper" style="width:100%">
      ${titlebar('Company_Store.exe')}
      <div class="row" style="justify-content:space-between"><div><div class="lbl">Kindly™ Company Store</div><h2>Spend it here.<br>Only here.</h2></div><div style="text-align:right"><div class="lbl">Balance</div><div class="scrip mono">${RUN.scrip}</div></div></div>
      ${S.promotePick ? '<div class="intel">Choose a crew member to promote in the roster.</div>' : ''}
      <div class="offers">${offerHtml}</div>
      <div class="row"><button class="btn" data-act="tomap" ${S.promotePick ? 'disabled' : ''}>Accept next deployment</button><span class="colony">Margin ${RUN.margin}% · Contract ${RUN.idx + 1} next${RUN.idx >= CONTRACTS_PER_SECTOR ? ' (boss)' : ''}</span></div>
    </div>
    <div class="paper" style="width:100%">
      ${titlebar('Personnel.db')}
      <h3>Roster ${RUN.roster.length}/8</h3><div class="rlist">${rosterHtml}</div>
      <h3>Relics</h3><div class="relics">${relicHtml}</div>
    </div>
  </div></div>`;
}
function buy(i) {
  const it = RUN.offers[i]; if (!it || it.sold || RUN.scrip < it.price) return;
  if (it.kind === 'hire') { if (RUN.roster.length >= 8) return; RUN.roster.push(mkCrew(it.type, it.name, it.look, it.quirk)); }
  else if (it.kind === 'relic') RUN.relics.push(it.id);
  else if (it.kind === 'train') { if (!RUN.roster.some(c => c.level < MAXL)) return; S.promotePick = true; }
  else if (it.kind === 'account') RUN.margin = Math.min(100, RUN.margin + 15);
  RUN.scrip -= it.price; it.sold = true;
  showStore();
}
function showGameOver() {
  S.screen = 'over'; clearMissionUi(); backdropView(); setMusic(null);
  const colony = store.get('al_colony', 0) + 1; store.set('al_colony', colony);
  const where = planetName();
  const c = M ? M.c : null; M = null;
  $('#overlay').innerHTML = `<div class="screen"><div class="paper">
    ${titlebar('Termination_Notice.txt')}
    <div class="lbl" style="color:var(--danger)">Notice of contract termination</div>
    <h2>Stranded on ${esc(where)}</h2>
    <div class="memo">Dear Employee #${RUN.empId},

Your performance on ${esc(c ? c.planet : 'assignment')} has pushed company profit margin below the profitability threshold.
Your seat on the return shuttle has been reallocated to <b>3 crates of ${esc(c ? c.client.asset : 'crystals')}</b>.

You have been relocated to ${esc(where)}: atmosphere unbreathable, temperature unreasonable, rent still due.
Your crew (${RUN.roster.map(r => esc(r.name)).join(', ')}) ${RUN.roster.length > 1 ? 'have' : 'has'} been included free of charge.

Thank you for choosing Kindly™.                                         — HR-BOT</div>
    <p>You join the <b>Colony of the Abandoned</b>, a settlement of former employees who were also not profitable enough. Survivors: <b>${colony}</b>. Each one gives future new hires +5 starting scrip, up to 50.</p>
    <div class="mono" style="color:var(--muted);font-size:19px">Contracts completed: ${RUN.history.length} · Hostiles pacified: ${RUN.kills} · Margin lost: ${RUN.lostTotal}%</div>
    <div class="row"><button class="btn" data-act="newrun">Clock in again</button><button class="btn ghost" data-act="title">Main menu</button></div>
  </div></div>`;
}
function showVictory() {
  S.screen = 'win'; const c = M.c; M = null; clearMissionUi(); backdropView(); sfx('victory'); setMusic('menu');
  $('#overlay').innerHTML = `<div class="screen"><div class="paper">
    ${titlebar('Unknown_Sender.msg')}
    <div class="mailhead"><span>From</span><b>[SENDER REDACTED]</b><span>To</span><b>Employee #${RUN.empId}</b><span>Subject</span><b>you have done well</b></div>
    <h2>${esc(c.fac.boss.name)} neutralised</h2>
    <div class="mailbody">
      <p>The board thanks you. You may not have met the board. That is for the best.</p>
      <p>Every crystal you guarded, every ${esc(c.fac.short.toLowerCase())} you pacified, every crew member denied a lunch break produced exactly the right amount of suffering. We have eaten well this quarter.</p>
      <p>Your margin of ${RUN.margin}% is acceptable. Your losses were acceptable. You are acceptable. Report to Sector 2. Do not look directly at the CEO.</p>
      <p style="color:var(--muted);font-size:14px">— Q.</p>
    </div>
    <div class="memo">END OF VERTICAL SLICE
Contracts completed: ${RUN.history.length} · Hostiles pacified: ${RUN.kills} · Final margin: ${RUN.margin}%
Crew: ${RUN.roster.map(r => `${esc(r.name)} (Lv${r.level})`).join(', ')}</div>
    <div class="row"><button class="btn" data-act="newrun">Clock in again</button><button class="btn ghost" data-act="title">Main menu</button></div>
  </div></div>`;
}

// ---------- input ----------
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act !== 'pickperk') sfx(act === 'buy' ? 'buy' : act === 'accept' || act === 'newrun' || act === 'tomap' ? 'confirm' : 'click');
  if (act === 'newrun') { newRun(); showMap(); }
  else if (act === 'title') showTitle();
  else if (act === 'accept') { const o = RUN.options[i]; startMission(o); }
  else if (act === 'mapback') { S.mapSel = -1; showMap(); }
  else if (act === 'settings') showSettings();
  else if (act === 'closecfg') closeSettings();
  else if (act === 'testsfx') { sfx('snipe'); setTimeout(() => sfx('promote'), 350); }
  else if (act === 'start') { if (M && M.phase === 'prep') { M.phase = 'drill'; sfx('start'); toast('Extraction started. No breaks.', 1600); } }
  else if (act === 'pause') { if (M) M.paused = !M.paused; }
  else if (act === 'speed') { if (M) { M.speed = +b.dataset.v; M.paused = false; } }
  else if (act === 'crew') {
    const cr = RUN.roster[i];
    if (cr.reviews.length && !cr.snooze) { showReview(cr); return; }
    if (M.deployedIds.has(cr.id)) { S.selTower = M.towers.find(t => t.crew === cr) || null; S.selCrew = -1; renderTowerInfo(); }
    else { S.selCrew = S.selCrew === i ? -1 : i; S.selTower = null; renderTowerInfo(); }
    buildRosterBar();
  }
  else if (act === 'reassign') { if (S.selTower) reassign(S.selTower); }
  else if (act === 'closeinfo') { S.selTower = null; renderTowerInfo(); }
  else if (act === 'tostore') { if (!startReviewFlow()) showStore(); }
  else if (act === 'review') showReview(RUN.roster.find(c => c.id === b.dataset.id));
  else if (act === 'pickperk') resolveReview(b.dataset.id);
  else if (act === 'decline') resolveReview(null);
  else if (act === 'closereview') closeReview(true);
  else if (act === 'appeal') { const cr = RUN.roster.find(c => c.id === S.reviewOpen), cost = appealCost(); if (cr && RUN.scrip >= cost) { RUN.scrip -= cost; RUN.appeals = (RUN.appeals || 0) + 1; cr.opts = null; showReview(cr); } }
  else if (act === 'buy') buy(i);
  else if (act === 'promote') { const cr = RUN.roster[i]; S.promotePick = false; if (cr && cr.level < MAXL) { cr.level++; cr.xp = Math.max(cr.xp, XP_TH[cr.level - 1]); cr.reviews.push(cr.level); showReview(cr); } else showStore(); }
  else if (act === 'dismiss') { if (RUN.roster.length > 1) { RUN.roster.splice(i, 1); showStore(); } }
  else if (act === 'tomap') { RUN.options = genOptions(); showMap(); }
});
cv.addEventListener('pointermove', ev => {
  const p = toLogical(ev);
  if (S.screen === 'mission') S.hover = p;
  else if (S.screen === 'map') {
    PARALLAX.x = (p.x / VIEW.w - 0.5) * -2; PARALLAX.y = (p.y / VIEW.h - 0.5) * -2;
    const h = planetAt(p); if (h >= 0 && h !== S.mapHover) sfx('hover'); S.mapHover = h;
    cv.style.cursor = S.mapHover >= 0 ? 'pointer' : 'default';
  }
});
cv.addEventListener('pointerleave', () => { S.hover = null; });
cv.addEventListener('pointerdown', ev => {
  const p = toLogical(ev);
  if (S.screen === 'map') {
    const i = planetAt(p);
    if (i >= 0) showContractCard(i);
    return;
  }
  if (S.screen !== 'mission' || !M) return;
  S.hover = p;
  const tl = tileAt(p.x, p.y); if (!tl) return;
  const tw = towerAtTile(tl.tx, tl.ty);
  if (tw) { S.selTower = tw; S.selCrew = -1; renderTowerInfo(); buildRosterBar(); return; }
  if (S.selCrew >= 0) {
    if (!canBuild(tl.tx, tl.ty)) { toast(M.grid[tl.ty][tl.tx] === 1 ? 'Crew cannot stand on the path. Union rules (ours).' : 'Cannot deploy there', 1500); return; }
    deploy(S.selCrew, tl.tx, tl.ty);
  } else if (S.selTower) { S.selTower = null; renderTowerInfo(); }
});
function planetAt(p) {
  if (!RUN || !RUN.options) return -1;
  const t = performance.now() / 1000;
  for (let i = 0; i < RUN.options.length; i++) {
    const o = RUN.options[i]; if (o.px == null) continue;
    const bob = Math.sin(t * 0.8 + i * 2) * 6;
    if (Math.hypot(p.x - o.px, p.y - (o.py + bob)) < o.pr * 1.15) return i;
  }
  return -1;
}
document.addEventListener('keydown', ev => {
  const modal = !!$('#modal').innerHTML;
  if (modal && ev.key === 'Escape') { if (S.reviewOpen) closeReview(true); else closeSettings(); return; }
  if (ev.target.matches && ev.target.matches('input')) return;
  if (ev.key === 'm' || ev.key === 'M') { setMuted(!CFG.muted); return; }
  if (!modal && (ev.key === 'r' || ev.key === 'R') && RUN) { const cr = RUN.roster.find(c => c.reviews.length); if (cr) { showReview(cr); return; } }
  if (modal || S.screen !== 'mission' || !M) return;
  if (ev.key === ' ') { ev.preventDefault(); if (M.phase === 'prep') { M.phase = 'drill'; sfx('start'); } else M.paused = !M.paused; }
  else if (ev.key >= '1' && ev.key <= '8') { const i = +ev.key - 1; if (RUN.roster[i] && !M.deployedIds.has(RUN.roster[i].id)) { S.selCrew = S.selCrew === i ? -1 : i; buildRosterBar(); } }
  else if (ev.key === 'Escape') { S.selCrew = -1; S.selTower = null; renderTowerInfo(); buildRosterBar(); }
});

// ---------- main loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.screen === 'mission' && M) {
    if (!M.paused) { acc += dt * M.speed; let n = 0; while (acc >= STEP && n++ < 12) { stepMission(STEP); acc -= STEP; if (!M) break; } if (n >= 12) acc = 0; }
    if (M && S.screen === 'mission') { AU.intensity = M.t / M.T; renderMission(now); updateHud(); }
  } else if (S.screen === 'map') renderMap(now);
  else { beginDraw(); drawStars(now / 1000); }
  requestAnimationFrame(frame);
}

// test hook for automated playtesting
window.__AL = {
  get S() { return S; }, get RUN() { return RUN; }, get M() { return M; }, get GW() { return GW; }, get GH() { return GH; }, get VIEW() { return VIEW; }, genContract, BIOMES, PLANET_STYLES, autoReview, reviewOptions, pickPerk, PERKS, BRANCHES, QUIRKS, towerStats, showReview, AU, CFG, sfx, setMusic, TRACKS, genLook, FACTIONS, makeVariant, makeBossVariant, drawHuman, CREW_OUTFITS,
  newRun, showMap, startMission, deploy, stepMission, canBuild, genOptions, showStore, buy, finishMission, TOWERS,
};

resize(); showTitle(); requestAnimationFrame(frame);
</script>
